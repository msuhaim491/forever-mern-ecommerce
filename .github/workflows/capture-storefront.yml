name: Capture live storefront preview

# Runs once when this workflow is introduced, or manually when the design changes.
# Keeps the actual screenshot in the repository so README preview never relies
# on an external screenshot-hosting service.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-storefront.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forever-storefront-preview
  cancel-in-progress: false

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Capture the actual live homepage with Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version
          mkdir -p assets
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --window-size=1440,900 \
            --virtual-time-budget=9000 \
            --screenshot="$(pwd)/assets/forever-home-preview.png" \
            "https://forever-mern-suhaim491.netlify.app/"
          test -s assets/forever-home-preview.png
          file assets/forever-home-preview.png

      - name: Optimize image for GitHub README
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path('assets/forever-home-preview.png')
          target = Path('assets/forever-home-preview.webp')
          with Image.open(source) as image:
              assert image.width >= 1000 and image.height >= 600, 'Unexpected browser screenshot dimensions'
              image.convert('RGB').save(target, 'WEBP', quality=78, method=6)
          source.unlink()
          print('Saved', target, target.stat().st_size, 'bytes')
          PY
          test -s assets/forever-home-preview.webp

      - name: Publish screenshot to the same GitHub repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/forever-home-preview.webp
          if git diff --staged --quiet; then
            echo "Screenshot already up to date."
            exit 0
          fi
          git commit -m "docs: add real FOREVER storefront screenshot [skip ci]"
          git push origin HEAD:main
